<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha Docker Web Server</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; justify-content: center; align-items: center;
           height: 100vh; margin: 0; }
    .card { text-align: center; padding: 40px 60px; background: #1e293b;
            border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    h1 { color: #38bdf8; margin-bottom: 8px; }
    p { margin: 6px 0; }
    .badge { display: inline-block; margin-top: 14px; padding: 6px 14px;
             background: #22c55e; color: #052e16; border-radius: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Docker!</h1>
    <p>This page is served by nginx inside a container.</p>
    <p>CodeAlpha DevOps Internship - Task 4</p>
    <span class="badge">Container is running</span>
  </div>
</body>
</html>
